micronaut:
  application:
    name: cd-watcher-server
  server:
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins:
            - http://localhost:5173
  security:
    authentication: bearer
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${JWT_GENERATOR_SIGNATURE_SECRET:pleaseChangeThisSecretForANewOne}

datasources:
  default:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cdwatcher}
    username: ${DB_USER:cdwatcher}
    password: ${DB_PASSWORD:cdwatcher}
    driverClassName: org.postgresql.Driver
    schema-generate: NONE
    dialect: POSTGRES

flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:db/migration
