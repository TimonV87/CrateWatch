services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-cdwatcher}
      POSTGRES_USER: ${DB_USER:-cdwatcher}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cdwatcher}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cdwatcher}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: cd-watcher-server:0.1
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cdwatcher}
      DB_USER: ${DB_USER:-cdwatcher}
      DB_PASSWORD: ${DB_PASSWORD:-cdwatcher}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./cd-watcher-web
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
