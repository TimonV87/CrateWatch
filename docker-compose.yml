# Local development database only (the app itself runs with `dotnet run` / `npm run dev`).
# Production uses docker-compose.prod.yml, see DEPLOY.md.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-cdwatcher}
      POSTGRES_USER: ${DB_USER:-cdwatcher}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cdwatcher}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cdwatcher}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
