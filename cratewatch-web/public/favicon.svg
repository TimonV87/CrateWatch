<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="crate-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C4DFF" />
      <stop offset="1" stop-color="#18FFFF" />
    </linearGradient>
  </defs>
  <!-- record sleeves sticking out of the crate -->
  <rect x="9" y="8" width="8" height="22" rx="1.5" fill="#B388FF" transform="rotate(-9 13 30)" />
  <rect x="20" y="4" width="8" height="26" rx="1.5" fill="#18FFFF" />
  <rect x="31" y="8" width="8" height="22" rx="1.5" fill="#7C4DFF" transform="rotate(9 35 30)" />
  <!-- crate -->
  <rect x="4" y="22" width="40" height="22" rx="3" fill="#1B1B2B" stroke="url(#crate-gradient)" stroke-width="2" />
  <!-- the watching eye, with a vinyl record as the iris -->
  <path d="M11 35.5 Q24 25.5 37 35.5 Q24 45.5 11 35.5 Z" fill="#F3F0FF" />
  <circle cx="24" cy="35.5" r="5" fill="#121212" stroke="url(#crate-gradient)" stroke-width="1" />
  <circle cx="24" cy="35.5" r="2" fill="#7C4DFF" />
  <circle cx="24" cy="35.5" r="0.6" fill="#FFFFFF" />
</svg>
