# Production stack: only the frontend (nginx) is published, on 8081. NPMplus proxies the domain to it.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cdwatcher}
      POSTGRES_USER: ${DB_USER:-cdwatcher}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cdwatcher} -d ${DB_NAME:-cdwatcher}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./cratewatch-server-c/cratewatcher
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cdwatcher}
      DB_USER: ${DB_USER:-cdwatcher}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_GENERATOR_SIGNATURE_SECRET: ${JWT_GENERATOR_SIGNATURE_SECRET:?set JWT_GENERATOR_SIGNATURE_SECRET in .env (32+ chars)}
      COVER_ART_STORAGE_PATH: /app/cover-art-cache
      ARTIST_PHOTO_STORAGE_PATH: /app/artist-photo-cache
    volumes:
      - cover-art-cache:/app/cover-art-cache
      - artist-photo-cache:/app/artist-photo-cache
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./cratewatch-web
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  cover-art-cache:
  artist-photo-cache:
